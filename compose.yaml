services:
  ai-usage:
    build: .
    container_name: ai-usage
    user: "${AI_USAGE_UID:-1000}:${AI_USAGE_GID:-1000}"
    ports:
      - "127.0.0.1:7694:7694"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7694
      DATABASE_PATH: /data/ai_usage.db
      WEB_ROOT: /app/web/dist
      OPENCODE_CONFIG_DIR: /config/opencode
      OPENCODE_AUTH_PATH: /config/opencode-data/auth.json
      CODEX_HOME: /config/codex
    volumes:
      - "${AI_USAGE_DATA_HOST:-./data}:/data"
      - "${OPENCODE_CONFIG_HOST:-./secrets/opencode}:/config/opencode:ro"
      - "${OPENCODE_DATA_HOST:-./secrets/opencode-data}:/config/opencode-data:ro"
      - "${CODEX_HOME_HOST:-./secrets/codex}:/config/codex"
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7694/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
